name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    # Only run this workflow if we change files in the landing page folder
    paths:
      - 'LandingPage/src/mainframe-landing/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        working-directory: ./LandingPage/src/mainframe-landing
        run: npm install
        
      - name: Build
        working-directory: ./LandingPage/src/mainframe-landing
        run: npm run build
        
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./LandingPage/src/mainframe-landing/dist
